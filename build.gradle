import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot' version '3.5.14' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'idea'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'study.project.dealership'
    version = '1.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom 'org.testcontainers:testcontainers-bom:1.20.6'
            mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.14.0'
        }
        dependencies {
            dependency 'io.grpc:grpc-bom:1.75.0'
            dependency 'io.opentelemetry.instrumentation:opentelemetry-grpc-1.6:2.14.0-alpha'
            dependency 'io.opentelemetry.instrumentation:opentelemetry-kafka-clients-2.6:2.14.0-alpha'
            dependency 'io.opentelemetry.instrumentation:opentelemetry-spring-kafka-2.7:2.14.0-alpha'
            dependency 'com.google.protobuf:protobuf-java:3.25.5'
            dependency 'com.google.protobuf:protobuf-java-util:3.25.5'
            dependency 'ch.qos.logback:logback-core:1.5.25'
            dependency 'ch.qos.logback:logback-classic:1.5.25'
            dependency 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
            dependency 'org.jetbrains:annotations:26.0.2'
            dependency 'org.keycloak:keycloak-admin-client:22.0.1'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
    }
}
